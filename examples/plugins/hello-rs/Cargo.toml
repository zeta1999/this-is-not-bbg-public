[package]
name = "hello-rs"
version = "0.1.0"
edition = "2021"
description = "Notbbg Phase-10 Rust plugin demo: subscribes to ohlc.binance.* and surfaces the latest BTC tick."

[[bin]]
name = "hello-rs"
path = "src/main.rs"

[dependencies]
notbbg-pluginsdk = { path = "../../../libs/pluginsdk-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
