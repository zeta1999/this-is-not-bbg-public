syntax = "proto3";

package notbbg.v1;

option go_package = "github.com/notbbg/notbbg/server/pkg/protocol";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Canonical OHLC candlestick data.
//
// double fields keep the fast-math path (charts, indicators).
// _decimal counterparts carry the exchange-committed string —
// REQUIRED for crypto where adapter rounding can drift cents
// (decision 2026-04-24, captured in feedback_decimal_required.md).
// Adapters populate decimals from the raw json.Number; consumers
// needing exact fidelity (backtester, audit, OMS) prefer them.
message OHLC {
  string instrument = 1;   // e.g. "BTCUSD"
  string exchange   = 2;   // e.g. "binance"
  string timeframe  = 3;   // e.g. "1m", "5m", "1h", "1d"
  google.protobuf.Timestamp timestamp = 4;
  double open   = 5;
  double high   = 6;
  double low    = 7;
  double close  = 8;
  double volume = 9;
  string open_decimal   = 10;
  string high_decimal   = 11;
  string low_decimal    = 12;
  string close_decimal  = 13;
  string volume_decimal = 14;
}

// Single price level in an order book.
message PriceLevel {
  double price    = 1;
  double quantity = 2;
  uint32 order_count = 3;  // populated where venue exposes (e.g. Bybit); zero otherwise
  string price_decimal    = 4;  // exchange-committed string (see OHLC above)
  string quantity_decimal = 5;
}

// Snapshot of a limit order book.
message LOBSnapshot {
  string instrument = 1;
  string exchange   = 2;
  google.protobuf.Timestamp timestamp = 3;
  uint64 sequence_number = 4;
  repeated PriceLevel bids = 5;
  repeated PriceLevel asks = 6;
}

// A single executed trade.
message Trade {
  string instrument = 1;
  string exchange   = 2;
  google.protobuf.Timestamp timestamp = 3;
  double price    = 4;
  double quantity = 5;
  Side   side     = 6;
  string trade_id = 7;
  string price_decimal    = 8;  // exchange-committed string (see OHLC above)
  string quantity_decimal = 9;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY  = 1;
  SIDE_SELL = 2;
}

// A news item from RSS, GDELT, or other sources.
message NewsItem {
  string id          = 1;
  string title       = 2;
  string body        = 3;
  string source      = 4;  // e.g. "reuters", "coindesk"
  string url         = 5;
  google.protobuf.Timestamp published_at = 6;
  repeated string tickers  = 7;  // related tickers
  repeated string keywords = 8;
}

// An alert definition or triggered alert.
message Alert {
  string id   = 1;
  AlertType type = 2;
  string instrument = 3;  // empty for keyword/feed alerts
  string condition  = 4;  // human-readable condition, e.g. "> 100000"
  double threshold  = 5;
  AlertStatus status = 6;
  google.protobuf.Timestamp created_at   = 7;
  google.protobuf.Timestamp triggered_at = 8;
  string payload = 9;  // additional context when triggered
}

enum AlertType {
  ALERT_TYPE_UNSPECIFIED = 0;
  ALERT_TYPE_PRICE_ABOVE = 1;
  ALERT_TYPE_PRICE_BELOW = 2;
  ALERT_TYPE_VOLUME_SPIKE = 3;
  ALERT_TYPE_KEYWORD = 4;
  ALERT_TYPE_FEED_DOWN = 5;
}

enum AlertStatus {
  ALERT_STATUS_UNSPECIFIED = 0;
  ALERT_STATUS_ACTIVE    = 1;
  ALERT_STATUS_TRIGGERED = 2;
  ALERT_STATUS_DISMISSED = 3;
}

// Health status of a data feed.
message FeedStatus {
  string source_name = 1;
  google.protobuf.Timestamp last_update = 2;
  double latency_p50_ms = 3;
  double latency_p95_ms = 4;
  double latency_p99_ms = 5;
  uint64 error_count    = 6;
  uint64 bytes_received = 7;
  FeedState state = 8;
}

enum FeedState {
  FEED_STATE_UNSPECIFIED = 0;
  FEED_STATE_CONNECTED  = 1;
  FEED_STATE_RECONNECTING = 2;
  FEED_STATE_STALE = 3;
  FEED_STATE_ERROR = 4;
}

// A topic subscription request from a client.
message Subscription {
  string topic = 1;  // glob pattern, e.g. "ohlc.binance.*"
  map<string, string> filters = 2;
}

// SeriesKey identifies a point in a multi-dimensional time series.
// The `dims` map holds arbitrary key/value dimensions; well-known
// keys are { type, asset, pair, source, exchange, instrument, tenor,
// strike, side } by convention, but any dim may be added without
// breaking compatibility. See DATA-PLAN.md §5.
message SeriesKey {
  map<string, string> dims = 1;
}

// SeriesPoint is a single timestamped observation for a SeriesKey.
// The value is an oneof so scalars, structured market data, or
// arbitrary raw bytes can all be carried.
message SeriesPoint {
  SeriesKey key = 1;
  google.protobuf.Timestamp t = 2;
  oneof value {
    double      scalar = 10;
    OHLC        ohlc   = 11;
    LOBSnapshot lob    = 12;
    Trade       trade  = 13;
    bytes       raw    = 14;
  }
}

// Wrapper for any message sent over the bus or wire.
message Update {
  string topic = 1;
  google.protobuf.Timestamp timestamp = 2;
  oneof payload {
    OHLC        ohlc        = 10;
    LOBSnapshot lob         = 11;
    Trade       trade       = 12;
    NewsItem    news        = 13;
    Alert       alert       = 14;
    FeedStatus  feed_status = 15;
  }
}

// ---------------------------------------------------------------------
// U1 schema additions (2026-04-25): typed payloads for previously
// untyped bus.Message values. The Go bus.Message.Payload field stays
// `any` for now to keep blast radius small, but new payloads SHOULD
// land here so the conformance corpus (U5) can exercise them and the
// eventual `Payload proto.Message` tightening becomes mechanical.
// ---------------------------------------------------------------------

// Aggregated trade activity over a window. Replaces the ad-hoc
// map[string]any payload TUI/desktop saw on `trade.agg.<exchange>.<symbol>`.
message TradeAgg {
  string instrument = 1;
  string exchange   = 2;
  google.protobuf.Timestamp window_start = 3;
  google.protobuf.Timestamp window_end   = 4;
  uint64 count      = 5;   // number of trades in the window
  double volume     = 6;   // sum of quantities
  double notional   = 7;   // sum of (price * quantity)
  double vwap       = 8;   // notional / volume (when volume > 0)
  uint64 buy_count  = 9;
  uint64 sell_count = 10;
  // Side bias in [-1, 1]; positive = more buy-side notional.
  double side_bias  = 11;
}

// One-shot snapshot of the most recent trades for a topic; used for
// late-joining-client warmup so the trades panel isn't empty until
// the next live trade arrives.
message TradeSnap {
  string instrument = 1;
  string exchange   = 2;
  google.protobuf.Timestamp generated_at = 3;
  repeated Trade trades = 4;
}

// Single row of the cross-venue price-sanity matrix. Replaces the
// per-row map[string]any the SANITY tab consumes.
message SanityRow {
  string pair        = 1;   // e.g. "BTCUSDT"
  double median_price = 2;
  double max_dev_bp  = 3;   // max venue deviation in basis points
  google.protobuf.Timestamp updated_at = 4;
  // Per-venue breakdown: { exchange -> price }.
  map<string, double> prices = 5;
}

// Snapshot of the entire sanity matrix; published on `sanity.prices`
// at a slow cadence (so the SANITY tab can re-render in one frame).
message SanitySnapshot {
  google.protobuf.Timestamp generated_at = 1;
  repeated SanityRow rows = 2;
}

// Plugin liveness status. Published on `plugin.status` every ~10 s.
// The Go plugins.computePluginState function emits this shape.
message PluginStatus {
  string name          = 1;
  string state         = 2;  // "connected" | "stale" | "error" | "stopped"
  google.protobuf.Timestamp last_activity = 3;
  int32  pid           = 4;
  uint64 error_count   = 5;
  bool   running       = 6;
}

// GenericRow carries free-form rows from sources whose schema isn't
// stable enough to bind to a strongly-typed proto today (Sibelius
// tsbase_files, Ravel adapter, ad-hoc CSV ingest). The `payload`
// field uses google.protobuf.Struct so existing JSON-blob-style
// publishers don't have to upgrade in lockstep with the U1 work.
//
// New publishers SHOULD prefer a proper proto. GenericRow is the
// escape hatch, not the recommendation.
message GenericRow {
  string source = 1;   // e.g. "sibelius", "ravel", "tsbase_files"
  string kind   = 2;   // source-defined row kind, e.g. "voltools.snap"
  google.protobuf.Timestamp observed_at = 3;
  google.protobuf.Struct payload = 4;
}
